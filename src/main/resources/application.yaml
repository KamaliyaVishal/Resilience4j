spring:
  application:
    name: resilience4j

server:
  port: 8090

resilience4j:
  # =========================================================================
  # CIRCUIT BREAKER CONFIGURATION
  # =========================================================================
  circuitbreaker:
    configs:
      # 1. Define a global baseline blueprint
      default:
        registerHealthIndicator: true

        # Sliding Window Settings
        slidingWindowType: COUNT_BASED       # Can be COUNT_BASED or TIME_BASED
        slidingWindowSize: 10                # Monitor the last 10 requests
        minimumNumberOfCalls: 5              # Minimum requests needed before calculating error rate

        # Failure Thresholds
        failureRateThreshold: 50             # Open circuit if 50% or more calls fail
        slowCallRateThreshold: 75            # Open circuit if 75% or more calls are slow
        slowCallDurationThreshold: 5s        # A call taking > 5s is considered slow

        # State Transitions & Timers
        waitDurationInOpenState: 5s          # Wait 5 seconds in OPEN state before trying again (HALF-OPEN)
        permittedNumberOfCallsInHalfOpenState: 3 # Test the network with 3 requests when HALF-OPEN
        automaticTransitionFromOpenToHalfOpenEnabled: true # Move to HALF-OPEN automatically when timer expires

        # Exception Handling (Uncomment and adjust if you want explicit filtering)
        #recordExceptions:
        #  - org.springframework.web.client.HttpServerErrorException
        #  - java.io.IOException
        #  - java.util.concurrent.TimeoutException
        #ignoreExceptions:
        #  - org.springframework.web.client.HttpClientErrorException

    instances:
      # 2. Assign configuration to your specific @CircuitBreaker(name = "testCircuitBreaker")
      testCircuitBreaker:
        baseConfig: default                  # Inherit everything from the default config above

  # =========================================================================
  # RETRY CONFIGURATION
  # =========================================================================
  retry:
    configs:
      # 1. Define a global baseline blueprint
      default:
        maxAttempts: 3                     # Total tries (1 initial call + 2 retries)
        waitDuration: 400ms                # Time to wait between standard retry attempts
        enableExponentialBackoff: true     # Gradually increase wait time between retries
        exponentialBackoffMultiplier: 2.0  # Double the wait time each time (500ms, then 1000ms)
        retryExceptions:                   # Specify which exceptions trigger a retry
          - java.lang.Exception
        #  - org.springframework.web.client.ResourceAccessException # e.g., Network timeouts
        #  - java.io.IOException
        #ignoreExceptions:                  # Explicitly skip retries for client errors
        #  - org.springframework.web.client.HttpClientErrorException # e.g., 404 or 400 Bad Request

    instances:
      # 2. Assign configuration to your specific @Retry(name = "testRetry")
      testRetry:
        baseConfig: default                # Inherit everything from the default config above
        maxAttempts: 4                     # Override to allow more attempts for this service


management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # 1. Expose health for status checks, and metrics/prometheus for detailed data
        include: "health, metrics, prometheus"

  endpoint:
    health:
      # 2. Required to see individual component details like the circuit breaker statuses
      show-details: always
      show-components: always

  health:
    # 3. CRUCIAL: Enables Resilience4j circuit breaker visibility inside /actuator/health
    circuitbreakers:
      enabled: true